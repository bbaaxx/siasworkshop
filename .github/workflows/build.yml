name: Build

on:
  push:
    branches: [main, 'version/*']
  pull_request:
    branches: [main, 'version/*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Gradle runs on JDK 21; each branch's Gradle toolchain
      # (21 for 1.21.1, 17 for 1.20.1) is auto-provisioned via the
      # foojay resolver in settings.gradle.
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: siasworkshop-dev-jar
          path: build/libs/
          if-no-files-found: error
