name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Checkout main (MC 1.21.1)
        uses: actions/checkout@v4
        with:
          path: mc-1.21.1
          ref: main

      - name: Build 1.21.1 jar
        run: |
          chmod +x ./mc-1.21.1/gradlew
          ./mc-1.21.1/gradlew -p mc-1.21.1 build --console=plain

      - name: Checkout version/1.20.1
        uses: actions/checkout@v4
        with:
          path: mc-1.20.1
          ref: version/1.20.1

      - name: Build 1.20.1 jar
        run: |
          chmod +x ./mc-1.20.1/gradlew
          ./mc-1.20.1/gradlew -p mc-1.20.1 build --console=plain

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mc-1.21.1/build/libs/siasworkshop-1.21.1-*.jar
            mc-1.20.1/build/libs/siasworkshop-1.20.1-*.jar
